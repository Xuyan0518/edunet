services:
  web:
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3003"
    env_file:
      - .env
    environment:
      API_PORT: "3003"
      API_HOST: "0.0.0.0"
      SERVE_WEB: "true"
      EDUNET_DEV_MODE: "true"
      NOTIFICATIONS_ENABLED: "false"
      DB_LOG_QUERIES: "false"
      CORS_ORIGIN: "http://localhost:${WEB_PORT:-3001},http://127.0.0.1:${WEB_PORT:-3001}"
    volumes:
      - dev-state:/app/.dev
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dev-state:
