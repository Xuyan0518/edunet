services:
  - type: web
    name: edunet-api-staging
    runtime: node
    plan: free
    region: singapore
    branch: feat/web-platform-migration
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: edunet-staging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: edunet-staging-db
    databaseName: edunet_staging
    user: edunet_staging
    plan: free
    region: singapore
